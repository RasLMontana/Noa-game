@keyframes pop{from{transform:scale(.6);opacity:0}to{transform:scale(1);opacity:1}}

{id:'ghost',n:'Призрак Маяка',ul:8,hp:480,atk:35,xp:300,c:230,cr:6,ore:6,sp:'rage',spt:'Ярость: ниже половины здоровья бьёт на 40% сильнее.',

function tk(){var n=0;for(var k in S.kills)n+=S.kills[k];return n}
function mw(){var m=0;for(var k in S.wl)m=Math.max(m,S.wl[k]);return m}

{id:'q1',n:'Первые шаги',d:'Выполни 3 задания',g:3,v:function(){return S.total},c:20,xp:15,cr:0},
{id:'q2',n:'Первая броня',d:'Купи первую экипировку',g:1,v:function(){return S.own.length},c:25,xp:20,cr:0},
{id:'q3',n:'Опытный путник',d:'Достигни 3 уровня',g:3,v:function(){return S.lvl},c:40,xp:0,cr:1},
{id:'q4',n:'Первая победа',d:'Победи любого босса',g:1,v:tk,c:40,xp:30,cr:2},

{id:'q8',n:'Гроза механизмов',d:'Победи Шестерёнчатого стража',g:1,v:function(){return S.kills.guard||0},c:150,xp:100,cr:5}];
var TITLES=['Новичок','Странник','Следопыт','Искатель','Охотник за тенями','Страж маяка'];

function load(){try{return JSON.parse(localStorage.getItem(KEY))}catch(e){return null}}
var TG=window.Telegram&&Telegram.WebApp,CS=TG&&TG.CloudStorage&&TG.isVersionAtLeast&&TG.isVersionAtLeast('6.9')?TG.CloudStorage:null,cst=null;
function save(){S.ts=Date.now();var j=JSON.stringify(S);try{localStorage.setItem(KEY,j)}catch(e){}
if(CS&&j.length<4000){clearTimeout(cst);cst=setTimeout(function(){try{CS.setItem('noa',j)}catch(e){}},1500)}}

var S=load()||fresh(),tab='hero',last=null;S.ore=S.ore||0;S.pot=S.pot||{p1:0,p2:0,p3:0};S.wl=S.wl||{};S.ch=S.ch||0;S.seen=S.seen||{};S.sh=S.sh||{};S.exp=S.exp||null;
