lamp:{w:'Ферн',k:'lamp',say:'Фонари на пристани гаснут один за другим. Запомни порядок, в котором они вспыхивают, и зажги их так же.',tip:'Опыт повышает уровень. За каждый уровень даётся очко навыков.'},
map:{w:'Мира',k:'dots',say:'Соедини ориентиры по порядку от 1 до 6, и тропа к болотам окажется на карте. Не ошибайся и поторопись.',tip:'Кристаллы нужны для закалки предметов в кузнице.'},
fish:{w:'Бран',k:'timing',n:3,sp:1.8,say:'Клюёт! Подсекай, когда поплавок в зелёной зоне. Три удачных подсечки, и ужин в таверне обеспечен.',tip:'Монеты можно потратить на броню и оружие в лавке.'},
bridge:{w:'Ферн',k:'pairs',say:'Мост у болот разбит. Найди пары материалов: гвозди, доски и молотки. Больше четырёх ошибок нельзя.',tip:'Руда и кристаллы выпадают и с боссов.'}};
var STORY=[
{n:'Берег',obj:'Выполни 2 задания',g:2,v:function(){return S.total},r:{c:30,xp:20},
intro:[['Ноа','Холодный песок. Над головой погасший маяк. Я не помню, кто я.'],['Мира','Живой? Редкость. Я Мира. В порту нужны руки. Загляни во вкладку «Дела» и займись работой.'],['Мира','Сделай два задания: заодно узнаешь, как тут всё устроено.']],
out:[['Мира','Неплохо для утопленника. Осколок в твоём кармане светится. Такие когда-то держали Маяк.'],['Ноа','Осколок… Значит, я как-то связан с Маяком.']]},
{n:'Броня',obj:'Купи экипировку в лавке',g:1,v:eqn,r:{c:30,xp:30},
intro:[['Ферн','Я Ферн, смотритель. На болота без брони не ходят. Загляни в «Лавку», открой вкладку «Шлемы» или «Доспехи» и купи что-нибудь.'],['Ферн','Вещь наденется сама, если слот пуст. Остальное меняй в «Рюкзаке».']],
out:[['Ферн','Теперь ты хоть похож на воина.'],['Ноа','Странно, но так привычнее.']]},
{n:'Болотный слизень',obj:'Победи Болотного слизня (нужен 2 уровень)',g:1,v:function(){return S.kills.slime||0},r:{c:40,xp:40,cr:2},
intro:[['Мира','На Болотах Шёпота сидит слизень и стережёт осколок. Нужен 2 уровень и 3 энергии.'],['Мира','Мало энергии? В лавке есть зелья. Бои во вкладке «Бои».']],
out:[['Ноа','Второй осколок. Он шепчет: «Найди остальные».'],['Мира','Значит, они разбросаны по всему архипелагу.']]},
{n:'Кузница',obj:'Улучши любой предмет в кузнице',g:1,v:mw,r:{c:40,xp:40,ore:2},
intro:[['Ферн','Сталь без ковки как память без прошлого. Во вкладке «Кузница» тратят руду и монеты, а закалка берёт кристаллы.'],['Ферн','Руду дают боссы, задания и походы, а у каждого оружия она своя. Смотри вкладку «Руда» в рюкзаке.']],
out:[['Ферн','Чувствуешь разницу в руке? Так и надо.']]},
{n:'Навыки',obj:'Вложи очко навыков',g:1,v:function(){return S.st.str+S.st.agi+S.st.vit},r:{xp:60,c:20},
intro:[['Мира','За каждый уровень тебе дают очко навыков. Вкладывай его во вкладке «Навыки»: сила бьёт сильнее, ловкость даёт крит и уклонение, стойкость прибавляет здоровье.']],
out:[['Мира','Правильно. Сильный путник доживает до старости.']]},
{n:'Каменный краб',obj:'Победи Каменного краба (нужен 4 уровень)',g:1,v:function(){return S.kills.crab||0},r:{c:80,xp:80,cr:3},
intro:[['Тень','Осколки не для тебя, Искатель. Они уже выбрали другого.'],['Ноа','Кто ты?'],['Мира','Тень. Он тоже ищет осколки. Краб на берегу стережёт третий, возьми его первым.']],
out:[['Ноа','Третий осколок. Я вижу башню и огонь. Это воспоминание.']]},
{n:'Шестерёнчатый страж',obj:'Победи стража (нужен 6 уровень)',g:1,v:function(){return S.kills.guard||0},r:{c:120,xp:120,cr:4},
intro:[['Ферн','На Острове Шестерён старый механизм принял осколок за ключ. Страж бьёт тяжело и носит броню.'],['Ферн','Без закалённого оружия не лезь.']],
out:[['Ноа','Четвёртый осколок. Я вспоминаю: я стоял на вершине Маяка.']]},
{n:'Призрак Маяка',obj:'Победи Призрака Маяка (нужен 8 уровень)',g:1,v:function(){return S.kills.ghost||0},r:{c:300,xp:200,cr:5},
intro:[['Тень','Призрак ждёт тебя. Он помнит то, что ты забыл.'],['Мира','Не слушай его. Бей и держи щит.']],
out:[['Ноа','Я вспомнил. Я был Хранителем Маяка. Я сам погасил его, чтобы Призрак не вышел в море.'],['Мира','И что теперь?'],['Ноа','Теперь я зажгу его снова.'],['Ферн','Маяк снова дышит, но море ещё помнит. Впереди Утонувший Город.']]},
{n:'Штормовой змей',obj:'Победи Штормового змея (нужен 10 уровень)',g:1,v:function(){return S.kills.serpent||0},r:{c:250,xp:250,cr:5},
intro:[['Мира','С тех пор как Призрак пал, море взбесилось. У входа в Утонувший Город кружит змей, и ни одна лодка не проходит.'],['Ферн','Чешуя у него колючая: чем сильнее бьёшь, тем больнее отдача. Возьми щит и побольше здоровья.'],['Ноа','Мне нужно попасть в город. Там что-то моё.']],
out:[['Ноа','Из пасти змея выпал пятый осколок. Он тёплый, как будто его только что держали в руке.'],['Мира','Тень уже шла по твоим следам. Не оглядывайся слишком долго.']]},
{n:'Жнец тумана',obj:'Победи Жнеца тумана (нужен 12 уровень)',g:1,v:function(){return S.kills.reaper||0},r:{c:350,xp:350,cr:7},
intro:[['Тень','Ты вернулся за тем, что потерял. А я за тем, что ты бросил. Пройти дальше можно только через туман.'],['Мира','В тумане ходит Жнец. Он крадёт силу и лечится ею. Бей быстро и не затягивай бой.']],
out:[['Ноа','Туман рассеялся. Вдали видны башни, и они под водой.'],['Ферн','Тень говорила о том, что ты бросил. Что она имела в виду?'],['Ноа','Не знаю. Но, кажется, скоро узнаю.']]},
{n:'Достойная экипировка',obj:'Добудь предмет редкости «Эпический» или выше',g:1,v:function(){var n=0;S.own.forEach(function(id){var i=by(CLO,id);if(i&&(i.r||0)>=3)n++});S.wo.forEach(function(id){var w=by(W,id);if(w&&(w.r||0)>=3)n++});return n},r:{c:300,xp:300,cr:6},
intro:[['Ферн','Король города был воином, прежде чем утонул. Простая сталь его не возьмёт.'],['Ферн','Эпические вещи продаются в лавке за кристаллы и руду, а уникальные собираются в кузнице из осколков. Добудь хотя бы одну.']],
out:[['Ферн','Вот теперь ты выглядишь как тот, кому не стыдно открыть ворота Утонувшего Города.']]},
{n:'Утонувший король',obj:'Победи Утонувшего короля (нужен 14 уровень)',g:1,v:function(){return S.kills.king||0},r:{c:500,xp:500,cr:9},
intro:[['Мира','Король когда-то хранил ключ от Маяка. Когда море забрало город, он не ушёл. Прилив слушается его до сих пор.'],['Ноа','Я помню эти улицы. Я здесь ходил с факелом.'],['Мира','Тогда он узнает тебя раньше, чем ты его.']],
out:[['Король','Хранитель… Я держал ключ, пока ты не вернёшься. Забери его. Тень была частью тебя, той, что не смогла простить.'],['Ноа','Простить что?'],['Король','То, что ты сам погасил свет и оставил нас во тьме. Она хочет, чтобы Маяк не загорелся никогда.'],['Ферн','Значит, последний бой будет с самим собой.']]},
{n:'Тень Хранителя',obj:'Победи Тень Хранителя (нужен 16 уровень)',g:1,v:function(){return S.kills.shadow||0},r:{c:1000,xp:900,cr:16},
intro:[['Тень','Ты бросил меня в темноте, когда гасил огонь. Я помню каждую ночь.'],['Ноа','Я тоже помню. Я боялся, что Призрак выйдет в море. Но я не должен был оставлять тебя одну.'],['Тень','Слова ничего не стоят. Докажи.'],['Мира','Бей, но не ради победы. Ради того, чтобы ты смог её выслушать.']],
out:[['Тень','Ты… действительно вернулся.'],['Ноа','Прости. Пойдём со мной. Маяку нужны оба Хранителя: тот, кто гасил свет, и та, кто помнила во тьме.'],['Тень','Хорошо. Зажигай.'],['Ноа','Шесть осколков вспыхнули в ладонях, и над архипелагом поднялся белый луч. Туман отступил, и море впервые за много лет стало спокойным.'],['Мира','Добро пожаловать домой, Хранитель.'],['Ферн','Маяк светит. Но слышишь? Из глубины доносится далёкий напев. Это ещё не конец.']]},
{n:'Зов из глубины',obj:'Достигни 18 уровня',g:18,v:function(){return S.lvl},r:{c:400,xp:400,cr:6},
intro:[['Ферн','Маяк горит уже третью ночь, а на берег выбросило ракушки. Они поют сами собой.'],['Мира','В порту говорят, что у Фонарных скал кто-то зовёт моряков по именам. Слышу и я. Голос знакомый.'],['Ноа','Это не просто эхо. Но сначала мне нужна сила. Дойду до 18 уровня, тогда и выйдем.']],
out:[['Ферн','Теперь ты выдержишь то, что поёт в глубине.'],['Мира','Лодка готова. Не смотри в воду слишком долго.']]},
{n:'Сирена Бездны',obj:'Победи Сирену Бездны (нужен 18 уровень)',g:1,v:function(){return S.kills.siren||0},r:{c:1200,xp:900,cr:12},
intro:[['Мира','Она зовёт тебя по имени. Не отвечай и не слушай, бей.'],['Ноа','Она держит ритм, как будто знает мои шаги.'],['Ферн','Сирену трудно достать: она уходит от ударов, как вода между пальцев.']],
out:[['Сирена','Я не пела тебе. Я лишь повторяла то, что слышу снизу. Там просыпается тот, кого разбудил твой свет.'],['Ноа','Кто?'],['Сирена','Левиафан. Но до него на пути три стража. Они держат бездну закрытой, а теперь сами сошли с ума.']]},
{n:'Спутники',obj:'Собери двух питомцев',g:2,v:function(){return Object.keys(S.pets||{}).length},r:{c:600,xp:500,cr:8},
intro:[['Ферн','Бездна не любит одиночек. Моряки брали с собой зверей: те чуют беду раньше людей.'],['Мира','Загляни во вкладку «Питомцы». Двоих будет достаточно.']],
out:[['Мира','Смотри, как они к тебе тянутся.'],['Ферн','Теперь ты не один, а это уже половина победы.']]},
{n:'Пепельный кузнец',obj:'Победи Пепельного кузнеца (нужен 20 уровень)',g:1,v:function(){return S.kills.ember||0},r:{c:1500,xp:1100,cr:14},
intro:[['Ферн','На Пепельном острове, в сердце вулкана, стоит кузница, где когда-то отливали ключи для Маяка. Теперь там ковал кто-то другой, и ковал не по уговору.'],['Ноа','Кузнец, которого сломали собственным огнём. Жалко его.'],['Мира','Жалеть будешь потом. Он поджигает всё, чего касается.']],
out:[['Кузнец','Ты вернул мне руки. Возьми это: ключ, что я ковал для Хранителя. Он не откроет дверь, но не даст ей закрыться.'],['Ноа','Спасибо, мастер.'],['Кузнец','Идите ниже. Холод скажет остальное.']]},
{n:'Ледяной страж',obj:'Победи Ледяного стража (нужен 22 уровень)',g:1,v:function(){return S.kills.frost||0},r:{c:1900,xp:1400,cr:16},
intro:[['Мира','Ниже кузницы всё замёрзло. Даже тень Маяка покрылась инеем.'],['Ферн','Страж был вахтенным, пока не забыл смену. Теперь он дышит стужей и никого не пропускает.'],['Ноа','Его броня толще любой стали. Придётся бить сильнее.']],
out:[['Ноа','Лёд треснул, и из него вышла тёплая вода. Страж просто устал.'],['Мира','Остался один страж. Самый странный.']]},
{n:'Хозяин зеркал',obj:'Победи Хозяина зеркал (нужен 24 уровень)',g:1,v:function(){return S.kills.mirror||0},r:{c:2400,xp:1700,cr:18},
intro:[['Тень','Осторожнее, Хранитель. В этом зале каждое зеркало помнит то, что ты старался забыть.'],['Ноа','Тень? Ты здесь?'],['Тень','Я с тобой. Но в отражениях я не помощник: он вернёт тебе каждый удар.'],['Ферн','Бей не слишком часто и держи здоровье в запасе.']],
out:[['Ноа','Зеркало разбилось, и каждый осколок показал меня прежним, до Маяка, до тьмы.'],['Тень','Это не прошлое. Это путь, который ты выбрал. Иди дальше.']]},
{n:'Ночная вахта',obj:'Заверши 3 ночных дозора',g:3,v:function(){return S.wn||0},r:{c:2000,xp:1500,cr:20,pr:1},
intro:[['Мира','Чтобы выйти в глубину, Маяк должен гореть всю ночь без перерыва. Кто-то должен стоять на страже.'],['Ноа','Тогда я встану. Три ночи, и свет будет ровным.'],['Ферн','Загляни во вкладку «Дела», там есть «Ночной дозор».']],
out:[['Мира','Три ночи Маяк горел ровно. Море слушает.'],['Ферн','Теперь путь вниз открыт.']]},
{n:'Кракен-Затмитель',obj:'Победи Кракена-Затмителя (нужен 26 уровень)',g:1,v:function(){return S.kills.kraken||0},r:{c:3000,xp:2000,cr:24},
intro:[['Мира','Кракен закрыл вход в бездну, как крышка колодец. Стоит ему поднять голову, и свет Маяка гаснет.'],['Ферн','Затмитель. Он приходит с приливом, и каждая вторая его атака сильнее первой.'],['Ноа','Тогда будем бить в паузе.']],
out:[['Ноа','Он отпустил свет и уполз вниз. Вход открыт.'],['Мира','Дальше только он. Левиафан.']]},
{n:'Печать глубин',obj:'Выкуй 3 предмета комплекта глубин (Кузница, бездонная руда)',g:3,v:function(){return S.own.filter(function(id){var i=by(CLO,id);return i&&i.set==='deep'}).length},r:{c:4000,xp:2500,cr:30,pr:2},
intro:[['Ферн','Левиафан не пробьёшь обычной сталью. В его глубине давит вода, которой нет в мире.'],['Мира','Бездонная руда падает с тех, кто живёт на дне. Кузнец сможет сделать из неё доспех, но цена будет страшной.'],['Ноа','Сколько бы ни стоило. Без него вниз не спуститься.'],['Тень','Три вещи. Меньше не хватит, чтобы дышать там, где он спит.']],
out:[['Ферн','Тяжёлая работа. Теперь вода тебя не сомнёт.'],['Мира','Путь к Левиафану открыт.']]},
{n:'Левиафан Бездны',obj:'Победи Левиафана Бездны (нужен 28 уровень)',g:1,v:function(){return S.kills.leviathan||0},r:{c:5000,xp:3000,cr:40,pr:2},
intro:[['Левиафан','Вы зажгли огонь над моей колыбелью. Я спал, пока вы не напомнили, что море можно потушить.'],['Ноа','Мы не хотели тебя будить. Но и не дадим затопить острова.'],['Тень','Он питается чужой силой. Не давай ему затянуть бой.'],['Мира','Мы будем на берегу. Возвращайся.']],
out:[['Левиафан','Свет… Он был не для меня. Но я вижу его теперь. Спасибо, Хранитель.'],['Ноа','Левиафан ушёл в глубину тихо, и туман над островами рассеялся без следа.'],['Мира','Добро пожаловать домой снова, Хранитель.'],['Ферн','Вторая книга окончена. Но слышишь? Камни под затонувшим городом гудят. Что-то поднимается снизу.']]},
{n:'Эхо глубины',obj:'Достигни 30 уровня',g:30,v:function(){return S.lvl},r:{c:3000,xp:2000,cr:30},
intro:[['Мира','Левиафан ушёл, но камни под городом не замолчали. Они гудят в такт чьему-то сердцу.'],['Ферн','В старой книге я нашёл слово «Эхо». Что-то откликается на наш свет. Но ты ещё слишком слаб для глубины. Вырасти.'],['Ноа','Тогда я стану сильнее. Скажите, когда будет пора.']],
out:[['Ферн','Тридцатый рубеж. Теперь можно спускаться ниже, чем ходил король.'],['Мира','Первым ответил змей. Он плавает вокруг Маяка кругами.']]},
{n:'Морской змей',obj:'Победи Морского змея (нужен 30 уровень)',g:1,v:function(){return S.kills.wyrm||0},r:{c:4000,xp:3000,cr:35},
intro:[['Мира','Змей кружит у самого подножия Маяка. Рыбаки боятся выходить.'],['Тень','Он быстро регенерирует и любит прилив. Бей, пока он не ушёл под воду.'],['Ноа','Я займусь им.']],
out:[['Ноа','Змей уплыл вглубь, а вода у Маяка стала прозрачной.'],['Ферн','В его логове нашлись плиты с картой. Они ведут в забытый город.']]},
{n:'Забытый город',obj:'Пройди Руины затонувшего города 3 раза',g:3,v:function(){return S.rc||0},r:{c:3500,xp:2500,cr:30,pr:2},
